  intelligence to consumers, builders, and investors. Founded in 2018 and headquartered in Vilnius,
  Lithuania, DappRadar is a Prosus Ventures portfolio company. This profile was seeded from that
  portfolio and is being enriched by the API Evangelist pipeline.'
