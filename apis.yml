name: DappRadar
description: 'DappRadar is a blockchain application discovery and analytics platform, widely described
  as "the world''s dapp store." It tracks decentralized applications (dapps), NFT collections, tokens,
  and DeFi activity across many blockchains, providing rankings, portfolio tracking, and on-chain market
  intelligence to consumers, builders, and investors. Founded in 2018 and headquartered in Vilnius,
  Lithuania, DappRadar is a Prosus Ventures portfolio company. This profile was seeded from that
  portfolio and is being enriched by the API Evangelist pipeline.'
